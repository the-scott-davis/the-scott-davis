name: Build profile card

on:
  push:
    branches: [main]
    # Rebuild when the inputs change, not on every unrelated commit.
    paths:
      - "config.yml"
      - "assets/**"
      - "profilecard/**"
      - ".github/workflows/build.yml"
  schedule:
    # 04:00 UTC daily. Off-the-hour minutes get scheduled more reliably.
    - cron: "17 4 * * *"
  workflow_dispatch:

# A scheduled run and a push run committing at the same time would collide.
concurrency:
  group: build-profile-card
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate config
        run: python -m profilecard --check

      - name: Build cards
        env:
          # A PAT stored as the ACCESS_TOKEN secret. The built-in GITHUB_TOKEN is
          # scoped to this repository only, so it cannot read anything else you
          # have contributed to.
          #
          # Use a CLASSIC token with the `repo` scope. A fine-grained token
          # granting only Contents+Metadata is not enough: private contribution
          # counts come from restrictedContributionsCount, which returns 0
          # unless the token carries `repo`. If most of your work is in private
          # repositories, that is the difference between a real number and zero.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python -m profilecard

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist cache
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: rebuild profile card"
            git push
          fi
