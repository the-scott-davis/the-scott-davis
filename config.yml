# ══════════════════════════════════════════════════════════════════════════════
#  Everything on the card is declared here.  Nothing is hardcoded in the SVGs --
#  they are generated from this file, so add a line, delete a line, or reorder
#  the list and the layout reflows on its own.
#
#  Regenerate after editing:   make build      (or: python -m profilecard --offline)
#  Full reference:             docs/CUSTOMIZING.md
# ══════════════════════════════════════════════════════════════════════════════

github:
  username: the-scott-davis

  # Which repositories count toward the lines-of-code and contribution stats.
  affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]
  # Which repositories count toward the star total.
  star_affiliations: [OWNER]
  # Skip these entirely, e.g. a vendored fork that would skew the numbers.
  exclude_repos: []
  # Count only commits authored by you, rather than every commit in the repo.
  only_my_commits: true

# ──────────────────────────────────────────────────────────────────────────────
#  Free-form values you can reference from any field below as {name}.
#  Add your own keys here -- they become placeholders automatically.
# ──────────────────────────────────────────────────────────────────────────────
vars:
  name: Scott Davis

# ──────────────────────────────────────────────────────────────────────────────
#  What you build with.
#
#  GitHub's language statistics measure BYTES and have no sense of time, so one
#  large old service outranks every recent project. `since_years` fixes that.
#  They also cannot see a framework, a cloud, or a database -- Next.js, Vercel
#  and Postgres all just read as "TypeScript" -- so the technology list is
#  detected from dependency manifests and marker files instead, and ranked by
#  how many repositories use each one.
# ──────────────────────────────────────────────────────────────────────────────
stack:
  since_years: 1          # only repos pushed this recently; 0 or null for all time
  exclude_languages:
    - HTML                # markup inflates badly against real code
    - CSS
    - SCSS
    - Less
    - Dockerfile
    - Shell
    - Makefile            # build plumbing, not something anyone writes in
    # 594 bytes in one repo, all of it backend/alembic/script.py.mako -- the
    # stencil `alembic init` drops in to stamp out migrations. Nobody wrote it,
    # and at 0.002% of all code it was still placing fifth, because fifth place
    # is whatever survives this list.
    - Mako
    - "C#"                # must be quoted -- a bare # starts a YAML comment
    - TSQL
    - PHP
    - Lua
    - HCL
    - PowerShell
  exclude_tech: []
  limit: 8
  sample_repos: 6         # repos to sample commit times from; 0 disables the hour stat
  # Commit timestamps arrive in UTC. A named zone handles daylight saving across
  # a whole year of commits; the offset is only a fallback for Python < 3.9.
  timezone: America/Chicago
  timezone_offset: -5

# ──────────────────────────────────────────────────────────────────────────────
#  Source art -> portrait.  `make portrait` re-runs this; every value maps to a
#  flag on `python -m profilecard.portrait --help`, so you can dial it in
#  interactively and then write the numbers you liked back here.
#
#  mode: ascii  -> a block of monospace characters (what is shipped)
#  mode: pixel  -> a small colour PNG, drawn on the card as solid rectangles
#
#  Which mode suits your art depends entirely on its LUMINANCE contrast, because
#  characters have no colour to work with.  Flat, evenly-lit photographs turn to
#  mush in ascii no matter how many columns you give them.  Logos and other
#  high-contrast silhouettes are the ideal case -- this one separates by roughly
#  215 levels out of 255, so a near-binary ramp renders it crisply.
#  To use a photograph instead, switch to `mode: pixel`; see docs/CUSTOMIZING.md.
# ──────────────────────────────────────────────────────────────────────────────
portrait:
  source: assets/logo.png
  mode: ascii
  width: 80                        # target columns before trimming
  crop: [0.145, 0.081, 0.867, 0.957]  # left, top, right, bottom as 0..1 fractions
  cell_aspect: 0.545               # portrait_char_width / portrait_line_height, below
  ramp: silhouette                 # " .:-+*#%@"
  sharpen: 1.2                     # recovers frond edges lost to downsampling
  # A narrow black/white window is a soft threshold: the disc goes solid, the
  # background goes empty, and only the anti-aliased edges land in between.
  black_point: 0.40
  white_point: 0.60
  outputs:
    main:
      path: assets/portrait.txt

# ──────────────────────────────────────────────────────────────────────────────
#  The card itself.
#
#  Placeholders:  {name} and anything else under `vars:`, plus
#    {username} {age} {commits} {stars} {repos} {contributed} {followers}
#    {loc} {loc_added} {loc_deleted}   -- all pre-formatted with thousands separators.
#  Inline colour:  <key>..</key>  <value>..</value>  <dim>..</dim>
#                  <add>..</add>  <del>..</del>      (colours come from the theme)
#  Literal braces: {{ and }}
#  A dot in a label renders as a nested key, e.g. Languages.Programming
# ──────────────────────────────────────────────────────────────────────────────
card:
  title: "{name} <dim>@</dim> {username}"
  font_size: 16
  line_height: 20
  padding: 18
  corner_radius: 14
  gutter: 4              # blank columns between the portrait and the field list

  # The portrait is optional. Turn it off if the same art is already your GitHub
  # avatar -- the profile page then shows it twice, side by side.
  #
  # With no portrait the whole width goes to text, so `columns` defaults to 2:
  # one tall column of rows against a full-width README is mostly empty space.
  # Set it explicitly (1, 2, 3, ...) to override. Columns are split on the
  # `separator` lines below, whole sections at a time, choosing the split that
  # makes the tallest column as short as possible -- or wherever you put a
  # `- column_break: true` field, which wins over that.
  show_portrait: false
  # columns: 2
  column_gutter: 4       # blank columns between two field columns
  title_gap: 16          # extra pixels under the title, around its rule
  heat_cell: 7           # side of one contribution square
  heat_gap: 2            # space between squares
  # The portrait is texture, not text, so it is set smaller than the field list.
  # That is what buys the column count an ascii portrait needs to hold detail.
  portrait_font_size: 10
  portrait_line_height: 11
  portrait_char_width: 6.0
  pixel_size: 6          # only used by `mode: pixel`
  portrait_radius: 6     # rounded corners, only used by `mode: pixel`

  fields:
    # `heading` opens a section and puts a blank line above itself, so the rows
    # under one drop the prefix they used to carry: "Commits.Per day" was only
    # repeating what the heading now says.
    #
    # Left column: who, what I build with, and when I work.
    - heading: Profile
    - label: GitHub age
      value: "{github_age}"
    # Deliberately no email. A published address on a high-traffic profile is a
    # scraping target, and LinkedIn already provides a route to make contact.
    - label: LinkedIn
      value: linkedin.com/in/scott-davis-fl

    # Detected from dependency manifests, not self-reported.
    - heading: Stack
    - label: Building with
      value: "{tech_6}"
    - label: Primary
      value: "{language_top} <dim>·</dim> {language_top_pct}% of recent code"
    - label: Also
      value: "{languages_list}"

    # Commits counts the work; this is the shape of it over a year.
    - heading: Rhythm
    - label: Active days
      value: "{active_days} of {calendar_days} <dim>({active_pct}%)</dim>"
    - label: Streak
      value: "{current_streak} days <dim>·</dim> best {longest_streak}"
    - label: Record
      value: "{busiest_count} in one day <dim>({busiest_date})</dim>"
    - label: Busiest day
      value: "{busiest_weekday}s"
    - label: Peak hours
      value: "{busiest_window}"
    - label: Weekends
      value: "{weekend_pct}% of all commits"

    # Right column: the output, and the year of it drawn out. Placed by hand --
    # the grid is worth several rows, and only this split leaves both columns
    # the same height.
    - column_break: true

    - heading: Commits
    - label: "{year}"
      value: "{commits_ytd} <dim>so far</dim>"
    - label: "{prev_year}"
      value: "{commits_prev_year}"
    - label: All time
      value: "{commits}"
    - label: Per day
      value: "{per_day}"

    - heading: Shipped
    - label: Pull requests
      value: "{prs_merged} merged <dim>·</dim> {prs_open} open"
    - label: Issues
      value: "{issues_opened} opened"
    - label: Repositories
      value: "{repos} owned <dim>·</dim> {contributed} contributed to"

    # The same contribution grid the streak and active-day figures above are
    # read out of -- already fetched, so it costs no extra API call.
    - heading: Last 365 days
    - heatmap: contributions

# ──────────────────────────────────────────────────────────────────────────────
#  The LinkedIn cover photo.  Same stats, same placeholders, same markup -- but
#  a fixed 1584x396 canvas instead of one that grows to fit, so content that
#  does not fit is an error rather than a card with its edge cut off.
#
#  Three numbers below are not arbitrary, and changing one without the others
#  will put text where nobody can read it:
#
#    safe_width  LinkedIn's app crops to roughly the middle 60% of the width.
#                Anything wider than this is simply not on screen on a phone.
#    offset_x    The profile photo covers the bottom-left corner, out to about
#                x=357.  Nudging the block right by 20px clears it and lands
#                the right edge exactly on the mobile crop -- the only window
#                that satisfies both is 910px wide, and this is it.
#    font_size   Larger than the card's 16px because LinkedIn shows the banner
#                at roughly half these dimensions.  Width is what limits it:
#                70 characters into 910px is 13px per character, so 21px type.
#
#  Regenerate:  make banner
# ──────────────────────────────────────────────────────────────────────────────
banner:
  # The format is settled, so this is on: every fetch now writes
  # dist/linkedin_banner.png, which is the file to upload. Set it to false
  # while reworking the layout and nothing renders or gets committed.
  enabled: true

  output: dist/linkedin_banner.svg
  png: dist/linkedin_banner.png
  theme: dark            # a banner is one baked image; it cannot follow the reader
  safe_width: 950
  # Both stack rows are lists too long for one line. Wrapping them onto
  # continuation rows spends height, which this canvas has, instead of width,
  # which it does not -- and that is what keeps the type at 20px. Unwrapped,
  # the same content only fits at 15px.
  wrap_cols: 42
  font_size: 20
  line_height: 27
  # One dot rather than the card's two. It buys two characters across the two
  # columns, which is the difference between clearing the mobile crop and
  # sitting hard against it.
  min_dots: 1
  headline_font_size: 26
  headline_gap: 18

  # <heading> is the theme's brightest text; plain fg read as another body row.
  # Not in `link:`, which right-aligns to the block edge and would leave a wide
  # empty channel across the header with nothing on the left of it.
  headline: "<heading>github.com/{username}</heading>"
  subhead: ""
  link: ""

  fields:
    # The left column is deliberately the short one. Its rows would otherwise
    # run down into the corner the profile photo covers, so it ends at the
    # fifth -- around y=230, well above the photo's top edge at y=244.
    - heading: Rhythm
    - label: Active days
      value: "{active_days} of {calendar_days} <dim>({active_pct}%)</dim>"
    - label: Streak
      value: "{current_streak} <dim>·</dim> best {longest_streak}"
    - label: Peak hours
      value: "{busiest_window}"
    - label: Busiest day
      value: "{busiest_weekday}s"

    - column_break: true

    # The right column is clear of the photo at any height, so the long
    # sections go here. Stack leads: it is what the audience here reads for,
    # and the top of a column is the part that survives every crop.
    - heading: Stack
    # Names, not percentages. A language percentage is a share of BYTES in
    # repositories this account is attached to -- not a claim about skill, and
    # not comparable to the technology figures, which count repositories. Two
    # unrelated denominators side by side read as one scale.
    - label: Primary
      value: "{languages_5}"
    # Everything detected that is not already named above, so nothing repeats.
    - label: Other
      value: "{tech_other_5}"

    - heading: Commits
    - label: All time
      value: "{commits}"
    - label: "{year}"
      value: "{commits_ytd} <dim>so far</dim>"
    - label: "{prev_year}"
      value: "{commits_prev_year}"
    - label: Per day
      value: "{per_day}"

# ──────────────────────────────────────────────────────────────────────────────
#  One SVG is written per theme.  Add a third if you want one; the README's
#  <picture> element only switches between two, but nothing stops you.
# ──────────────────────────────────────────────────────────────────────────────
themes:
  dark:
    output: dist/dark_mode.svg
    portrait: assets/portrait.txt
    bg: "#161b22"
    fg: "#c9d1d9"
    key: "#ffa657"
    value: "#a5d6ff"
    dim: "#6e7681"
    add: "#3fb950"
    delete: "#f85149"
    rule: "#30363d"
    heading: "#e6edf3"   # section titles, the brightest text on the card
    # Contribution squares, quietest first. Hand-picked rather than left to the
    # automatic blend: orange desaturates to brown at low luminance, and with
    # 80% of days active the grid needs real separation between the steps or it
    # reads as one flat block. Swap in the blues from `value` if you prefer --
    # blue holds its saturation better down here.
    heat: ["#21262d", "#4d2a08", "#8a4a0d", "#cc7a1f", "#ffa657"]

  light:
    output: dist/light_mode.svg
    portrait: assets/portrait.txt
    bg: "#ffffff"
    fg: "#24292f"
    key: "#953800"
    value: "#0550ae"
    dim: "#6e7781"
    add: "#1a7f37"
    delete: "#cf222e"
    rule: "#d0d7de"
    heading: "#1f2328"
    heat: ["#eaeef2", "#ffd7b0", "#f0a05a", "#cc6a14", "#953800"]
